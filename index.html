<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamod Habi Website</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--card:#fffbe6;--line:#f5c800;--accent:#ffd400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130a;--fg:#f4f1e2;--muted:#b3ad92;--card:#24200e;--line:#c9a400;--accent:#ffd400}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(28px,8vw,44px);margin:0 0 16px;font-weight:500}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:20px}
.pill{border:2px solid var(--line);border-radius:20px;padding:14px 18px;background:var(--card);color:var(--fg);text-decoration:none;word-break:break-all}
.avatar{width:110px;height:110px;border-radius:50%;border:2px solid var(--line);background:var(--card);overflow:hidden}
.rating{flex:1;min-width:220px}
.stars{font-size:28px;color:var(--accent);letter-spacing:2px}
.bar{display:flex;align-items:center;gap:8px;font-size:14px;margin:3px 0}
.bar span:first-child{width:56px}
.track{flex:1;height:10px;border-radius:5px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.bar span:last-child{width:36px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.tile{border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:18px 10px;font-size:16px;cursor:pointer;font-family:inherit}
.tile[aria-selected="true"]{background:var(--accent);color:#111;font-weight:600}
.panel{display:none;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:16px}
.panel.on{display:block}
.panel h2{margin:0 0 8px;font-size:20px}
.muted{color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dt{font-weight:600}dd{margin:0}
label{display:block;margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
button.send{margin-top:12px;padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#111;font-weight:700;font-size:16px;cursor:pointer}
.rate button{background:none;border:0;font-size:32px;color:var(--muted);cursor:pointer;padding:0 2px}
.rate button.on{color:var(--accent)}
.sample{border:2px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}.tag{display:inline-block;background:var(--accent);color:#111;font-weight:700;font-size:12px;padding:2px 8px;border-radius:8px;margin-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:2px solid #ffd400;background:#111;font-size:26px;cursor:pointer;z-index:50;box-shadow:0 0 14px rgba(255,212,0,.6)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:60;padding:12px}.ov.on{display:flex}
.mod{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:#0e0c05;color:#fff4c2;border:2px solid #ffd400;border-radius:18px;padding:16px;box-shadow:0 0 24px rgba(255,212,0,.35)}
.mod .mh{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:18px}
.mod .num{width:34px;height:34px;border-radius:50%;background:#ffd400;color:#111;display:grid;place-items:center;font-weight:700;flex:none}
.mod .x{background:none;border:0;color:#ffd400;font-size:30px;cursor:pointer}
.chips{display:flex;gap:8px;margin:10px 0}.chip{flex:1;padding:8px;border:2px solid #c9a400;border-radius:10px;background:none;color:#fff4c2;cursor:pointer}.chip.on{background:#ffd400;color:#111;font-weight:700}
.pets{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pet{border:2px solid #c9a400;border-radius:14px;padding:10px;text-align:center;background:#17130a}.pet .em{font-size:40px}
.gold,.wide,.opt{display:block;width:100%;margin-top:8px;padding:10px;border-radius:12px;border:2px solid #ffd400;background:#ffd400;color:#111;font-weight:700;font-size:16px;cursor:pointer}
.wide,.opt{background:none;color:#fff4c2}.opt{padding:16px;margin-top:10px}
.mod input{width:100%;margin-top:10px;padding:12px;border:2px solid #c9a400;border-radius:10px;background:#17130a;color:#fff4c2;font:inherit}
.spin{width:70px;height:70px;border:5px dashed #ffd400;border-radius:50%;margin:24px auto;animation:sp 2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.big{font-size:56px;text-align:center;margin:18px 0;font-weight:700}.mod .er{color:#ff8a8a;min-height:20px;margin:6px 0 0}.demo{font-size:12px;opacity:.75;margin:14px 0 0;text-align:center}.mod small{opacity:.8}
.tip{position:fixed;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:#e53935;color:#fff;border:0;border-radius:14px;padding:10px 14px;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:bob 1.4s ease-in-out infinite}
.tip::after{content:"";position:absolute;right:22px;bottom:-9px;border:9px solid transparent;border-top-color:#e53935;border-bottom:0}
@keyframes bob{50%{transform:translateY(-5px)}}
</style>
</head>

var ALL=PETS.concat(MORE),MUL={Normal:1,Neon:2,Mega:3.5},S={ver:"Normal"},T=null;
var O=document.getElementById("ov"),M=document.getElementById("mod");
function price(b){return Math.round(b*MUL[S.ver])}
function hd(n,t,sub){return '<div class="mh"><span class="num">'+n+'</span><div style="flex:1"><b>'+t+'</b><br><small>'+sub+'</small></div></div>'}
function card(p){return '<div class="pet" data-n="'+p[0].toLowerCase()+'"><div class="em">'+p[1]+'</div><b>'+p[0]+'</b><div>$'+price(p[2])+'</div><button class="gold" data-pet="'+p[0]+'">Sell</button></div>'}
function stop(){clearTimeout(T);clearInterval(T)}
function go(n){
 stop();var h="";
 if(n===0){h='<div class="mh"><b>Sell Your Pet</b><button class="x" id="cx" aria-label="Close">&times;</button></div><small>Select a pet you want to sell to us!</small><div class="chips">'+["Normal","Neon","Mega"].map(function(v){return '<button class="chip'+(S.ver===v?' on':'')+'" data-ver="'+v+'">'+v+'</button>'}).join("")+'</div><div class="pets">'+PETS.map(card).join("")+'</div><button class="wide" id="more">&#128062; Or select another pet...</button><div id="ml" style="display:none;margin-top:10px"><input id="sq" placeholder="Search pets..."><div class="pets" id="pl" style="margin-top:10px;max-height:46vh;overflow:auto">'+MORE.map(card).join("")+'</div></div>'}
 if(n===1){h=hd(1,"Processing...","Waiting for the seller's response...")+'<div class="spin"></div><p style="text-align:center">Please wait while the seller puts their pet for sale...</p>';T=setTimeout(function(){go(2)},2500)}
 if(n===2){h=hd(2,"Payment Details","Choose a payment method:")+'<button class="opt" data-pay="Cash App">&#128178; Cash App</button><button class="opt" data-pay="PayPal">&#127359;&#65039; PayPal</button><button class="opt" data-pay="GCash">&#128309; GCash</button>'}
 if(n===3){h=hd(3,"Enter Your Info","Input the recipient's details:")+'<input id="nm" placeholder="Enter Name of Receiver" autocomplete="name"><input id="ph" placeholder="Enter Phone Number" inputmode="tel" autocomplete="tel"><p class="er" id="er"></p><button class="gold" id="s3">Submit</button>'}
 if(n===4){h=hd(4,"Transaction Code","Enter the transaction code:")+'<input id="cd" placeholder="Example: WQBRPA29" autocapitalize="characters"><p class="er" id="er"></p><button class="gold" id="s4">Submit</button><p class="demo">Demo code: '+CODE+'</p>'}
 if(n===5){h=hd(5,"Done","")+'<div class="big">&#10004;</div><p style="text-align:center"><b>Transaction details received!</b><br>Now wait for the seller to confirm.</p>';T=setTimeout(function(){go(6)},2000)}
 if(n===6){h=hd(6,"Submit Username","Enter your Roblox username:")+'<input id="un" placeholder="Enter your username" autocapitalize="none" autocomplete="username"><p class="er" id="er"></p><button class="gold" id="s6">Submit</button><p class="demo">Your username is sent to the seller by email.</p>'}
 if(n===7){var sec=10*60+24;h=hd(7,"Waiting for Seller","")+'<div class="big" id="tm"></div><p style="text-align:center">Minutes left<br><small>The seller will send you a friend request soon!</small></p><button class="wide" id="sk">Skip wait (demo)</button>';
  M.innerHTML=h+'<p class="demo">School project demo. No real payment or trade happens here.</p>';
  var tm=document.getElementById("tm");function tick(){var m=Math.floor(sec/60),s=sec%60;tm.textContent=m+":"+(s<10?"0":"")+s;if(sec--<=0){go(8)}}tick();T=setInterval(tick,1000);return}
 if(n===8){h=hd(8,"Notification","")+'<div class="big">&#9993;&#65039;</div><p style="text-align:center"><b>We\'ve sent a notification to your Gmail!</b><br>Check your Gmail for updates about the sale.</p><button class="gold" id="hm">&#127968; Back to Home</button>'}
 M.innerHTML=h+'<p class="demo">School project demo. No real payment or trade happens here.</p>';
}
function er(t){document.getElementById("er").textContent=t}
function openM(){S={ver:S.ver};O.classList.add("on");go(0)}
function closeM(){stop();O.classList.remove("on")}
document.getElementById("fab").onclick=openM;document.getElementById("tip").onclick=openM;
O.onclick=function(e){if(e.target===O)closeM()};
M.oninput=function(e){if(e.target.id==="sq"){var q=e.target.value.toLowerCase();[].forEach.call(M.querySelectorAll("#pl .pet"),function(p){p.style.display=p.dataset.n.indexOf(q)<0?"none":""})}};
M.onclick=function(e){var t=e.target,d=t.dataset||{};
 if(t.id==="cx"||t.id==="hm")return closeM();
 if(d.ver){S.ver=d.ver;return go(0)}
 if(t.id==="more"){var l=document.getElementById("ml");l.style.display=l.style.display==="none"?"block":"none";return}
 if(d.pet){S.pet=d.pet;S.base=ALL.filter(function(p){return p[0]===d.pet})[0][2];return go(1)}
 if(d.pay){S.pay=d.pay;return go(3)}
 if(t.id==="s3"){var n=document.getElementById("nm").value.trim(),p=document.getElementById("ph").value.replace(/\D/g,"");if(!n)return er("Enter the name of the receiver.");if(p.length<7)return er("Enter a valid phone number.");S.name=n;return go(4)}
 if(t.id==="s4"){var c=document.getElementById("cd").value.trim().toUpperCase();if(c!==CODE)return er("Wrong code. Try again.");return go(5)}
 if(t.id==="s6"){var u=document.getElementById("un").value.trim();if(u.length<3)return er("Enter your Roblox username.");
  var data={_subject:"Sell request: "+S.pet,_template:"table",_captcha:"false",roblox_username:u,pet:S.pet,version:S.ver,estimated_price:"$"+price(S.base),payment_method:S.pay};
  t.disabled=true;t.textContent="Sending...";
  fetch("https://formsubmit.co/ajax/"+MAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(){go(7)}).catch(function(){location.href="mailto:"+MAIL+"?subject="+encodeURIComponent("Sell request: "+S.pet)+"&body="+encodeURIComponent("Roblox username: "+u+"\nPet: "+S.pet+" ("+S.ver+")\nEstimated price: $"+price(S.base)+"\nPayment method: "+S.pay);go(7)});return}
 if(t.id==="sk")return go(8);
 if(d.ver===undefined&&t.closest&&t.closest("[data-pay]")){}
};
})();
</script>
